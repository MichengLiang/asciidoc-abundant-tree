name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v6
      # 书架是 aat 这个 pnpm 工作区的成员，依赖 workspace:* 的 aat：先装整个工作区、构建 aat 的 dist，
      # 书架才能用仓库里当前的 aat 把链接接到投影里恰好对上的那一节。书里的引用对不对由 workbench 的 bookgraph 审，
      # GitHub 上没有它，这里只构建（bookshelf/README.md）。
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build asciidoc-abundant-tree
        run: pnpm build
      - name: Build bookshelf
        run: pnpm --dir bookshelf run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bookshelf/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
