name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish. Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Resolve publish metadata
        id: package
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "workflow_dispatch version '$INPUT_VERSION' does not match package.json version '$PACKAGE_VERSION'" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
              echo "tag version '$TAG_VERSION' does not match package.json version '$PACKAGE_VERSION'" >&2
              exit 1
            fi
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Check npm version
        id: npm-version
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dispatch tag publish
        id: dispatch-tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags origin
          if git rev-parse "${{ steps.package.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.package.outputs.tag }} already exists; tag-triggered publish owns npm and release publication."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "${{ steps.package.outputs.tag }}"
          git push origin "${{ steps.package.outputs.tag }}"
          echo "Pushed ${{ steps.package.outputs.tag }}. The tag-triggered workflow run owns npm and release publication."
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: (github.event_name != 'workflow_dispatch' || steps.dispatch-tag.outputs.created == 'false') && steps.npm-version.outputs.published == 'false'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Check GitHub release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.package.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate GitHub release notes
        if: (github.event_name != 'workflow_dispatch' || steps.dispatch-tag.outputs.created == 'false') && steps.github-release.outputs.published == 'false'
        run: node scripts/release-notes.mjs "${{ steps.package.outputs.version }}" > release-notes.md
      - name: Create GitHub release
        if: (github.event_name != 'workflow_dispatch' || steps.dispatch-tag.outputs.created == 'false') && steps.github-release.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.package.outputs.tag }}" \
            --notes-file release-notes.md \
            --verify-tag
