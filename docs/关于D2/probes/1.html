<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>红楼梦人物关系图谱 · 关系卡片版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
    padding: 30px;
  }
  h1 {
    text-align: center;
    color: #8b4513;
    margin-bottom: 8px;
    font-size: 24px;
    font-weight: 600;
  }
  .subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 30px;
    font-size: 14px;
  }

  /* 图谱容器 */
  .graph-container {
    position: relative;
    width: 100%;
    height: 650px;
    background: #fffbf5;
    border: 1px solid #e0d5c5;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(139, 69, 19, 0.08);
  }

  /* SVG 连线层（在最底层） */
  .edges-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* ========== 节点卡片（人物） ========== */
  .node-card {
    position: absolute;
    width: 200px;
    background: #ffffff;
    border: 2px solid #d4a574;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 4px 12px rgba(139, 69, 19, 0.12);
    cursor: move;
    transition: box-shadow 0.25s, transform 0.25s;
    z-index: 3;
  }
  .node-card:hover {
    box-shadow: 0 6px 20px rgba(139, 69, 19, 0.2);
    transform: translateY(-2px);
  }
  .node-card.female { border-color: #d87093; background: linear-gradient(135deg, #fff5f8 0%, #ffffff 100%); }
  .node-card.male { border-color: #4682b4; background: linear-gradient(135deg, #f5faff 0%, #ffffff 100%); }

  .node-header {
    text-align: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #e0d5c5;
  }
  .node-name {
    font-size: 19px;
    font-weight: bold;
    color: #8b4513;
    letter-spacing: 1px;
  }
  .node-card.female .node-name { color: #c2185b; }
  .node-card.male .node-name { color: #1565c0; }

  .node-attrs {
    font-size: 12.5px;
    line-height: 1.9;
  }
  .attr-row {
    display: flex;
    justify-content: space-between;
  }
  .attr-label { color: #999; }
  .attr-value { color: #444; font-weight: 500; }

  /* ========== 关系卡片（边） ========== */
  .edge-card {
    position: absolute;
    min-width: 110px;
    background: #fff;
    border: 1.5px solid #bbb;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    /* 小三角装饰，暗示"连接"属性 */
  }
  .edge-card::before,
  .edge-card::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 8px;
    height: 8px;
    background: #fff;
    border: 1.5px solid #bbb;
    transform: translateY(-50%) rotate(45deg);
  }
  .edge-card::before { left: -5px; border-right: none; border-top: none; }
  .edge-card::after { right: -5px; border-left: none; border-bottom: none; }

  /* 关系类型配色 */
  .edge-card.love {
    border-color: #e57373;
    background: linear-gradient(135deg, #fff0f0 0%, #ffffff 100%);
  }
  .edge-card.love::before, .edge-card.love::after { border-color: #e57373; }

  .edge-card.marriage {
    border-color: #ffb74d;
    background: linear-gradient(135deg, #fff8e1 0%, #ffffff 100%);
  }
  .edge-card.marriage::before, .edge-card.marriage::after { border-color: #ffb74d; }

  .edge-card.blood {
    border-color: #81c784;
    background: linear-gradient(135deg, #f1f8e9 0%, #ffffff 100%);
  }
  .edge-card.blood::before, .edge-card.blood::after { border-color: #81c784; }

  /* 关系卡片内部结构 */
  .edge-main {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 4px;
    color: #555;
  }
  .edge-card.love .edge-main { color: #c62828; }
  .edge-card.marriage .edge-main { color: #ef6c00; }
  .edge-card.blood .edge-main { color: #2e7d32; }

  .edge-props {
    font-size: 11px;
    color: #777;
    line-height: 1.6;
    border-top: 1px dashed #eee;
    padding-top: 4px;
  }
  .edge-prop-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .edge-prop-label { color: #aaa; }
  .edge-prop-value { color: #666; }

  /* 连线样式 */
  .edge-line {
    fill: none;
    stroke-width: 2.5;
  }
  .edge-line.love { stroke: #e57373; }
  .edge-line.marriage { stroke: #ffb74d; stroke-dasharray: 8,5; }
  .edge-line.blood { stroke: #81c784; }

  /* 图例 */
  .legend {
    margin-top: 20px;
    display: flex;
    gap: 28px;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 13px;
    color: #666;
  }
  .legend-group {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .legend-line {
    width: 24px;
    height: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<h1>《红楼梦》人物关系图谱 · 关系卡片版</h1>
<div class="subtitle">节点人物卡片 + 边关系卡片 · 双卡片知识图谱 · 可拖拽</div>

<div class="graph-container" id="graph">
  <!-- 连线层（SVG） -->
  <svg class="edges-layer" id="edgesLayer"></svg>

  <!-- 节点 1：林黛玉 -->
  <div class="node-card female" id="node1" style="left: 60px; top: 100px;">
    <div class="node-header">
      <div class="node-name">林黛玉</div>
    </div>
    <div class="node-attrs">
      <div class="attr-row"><span class="attr-label">辈分</span><span class="attr-value">第三代</span></div>
      <div class="attr-row"><span class="attr-label">阵营</span><span class="attr-value">姑苏林氏</span></div>
      <div class="attr-row"><span class="attr-label">身份</span><span class="attr-value">贾母外孙女</span></div>
      <div class="attr-row"><span class="attr-label">居所</span><span class="attr-value">潇湘馆</span></div>
      <div class="attr-row"><span class="attr-label">判词</span><span class="attr-value">玉带林中挂</span></div>
    </div>
  </div>

  <!-- 节点 2：贾宝玉 -->
  <div class="node-card male" id="node2" style="left: 380px; top: 60px;">
    <div class="node-header">
      <div class="node-name">贾宝玉</div>
    </div>
    <div class="node-attrs">
      <div class="attr-row"><span class="attr-label">辈分</span><span class="attr-value">第三代</span></div>
      <div class="attr-row"><span class="attr-label">阵营</span><span class="attr-value">荣国府</span></div>
      <div class="attr-row"><span class="attr-label">身份</span><span class="attr-value">贾政次子</span></div>
      <div class="attr-row"><span class="attr-label">居所</span><span class="attr-value">怡红院</span></div>
      <div class="attr-row"><span class="attr-label">前身</span><span class="attr-value">神瑛侍者</span></div>
    </div>
  </div>

  <!-- 节点 3：薛宝钗 -->
  <div class="node-card female" id="node3" style="left: 700px; top: 120px;">
    <div class="node-header">
      <div class="node-name">薛宝钗</div>
    </div>
    <div class="node-attrs">
      <div class="attr-row"><span class="attr-label">辈分</span><span class="attr-value">第三代</span></div>
      <div class="attr-row"><span class="attr-label">阵营</span><span class="attr-value">金陵薛家</span></div>
      <div class="attr-row"><span class="attr-label">身份</span><span class="attr-value">薛姨妈之女</span></div>
      <div class="attr-row"><span class="attr-label">居所</span><span class="attr-value">蘅芜苑</span></div>
      <div class="attr-row"><span class="attr-label">判词</span><span class="attr-value">金簪雪里埋</span></div>
    </div>
  </div>

  <!-- 节点 4：贾母 -->
  <div class="node-card female" id="node4" style="left: 380px; top: 380px;">
    <div class="node-header">
      <div class="node-name">贾母</div>
    </div>
    <div class="node-attrs">
      <div class="attr-row"><span class="attr-label">辈分</span><span class="attr-value">第一代</span></div>
      <div class="attr-row"><span class="attr-label">阵营</span><span class="attr-value">荣国府</span></div>
      <div class="attr-row"><span class="attr-label">身份</span><span class="attr-value">贾府老祖宗</span></div>
      <div class="attr-row"><span class="attr-label">居所</span><span class="attr-value">荣庆堂</span></div>
      <div class="attr-row"><span class="attr-label">娘家</span><span class="attr-value">金陵世家</span></div>
    </div>
  </div>

  <!-- 节点 5：贾政 -->
  <div class="node-card male" id="node5" style="left: 120px; top: 400px;">
    <div class="node-header">
      <div class="node-name">贾政</div>
    </div>
    <div class="node-attrs">
      <div class="attr-row"><span class="attr-label">辈分</span><span class="attr-value">第二代</span></div>
      <div class="attr-row"><span class="attr-label">阵营</span><span class="attr-value">荣国府</span></div>
      <div class="attr-row"><span class="attr-label">身份</span><span class="attr-value">贾母次子</span></div>
      <div class="attr-row"><span class="attr-label">官职</span><span class="attr-value">工部员外郎</span></div>
      <div class="attr-row"><span class="attr-label">字</span><span class="attr-value">存周</span></div>
    </div>
  </div>
</div>

<!-- 图例 -->
<div class="legend">
  <div class="legend-group">
    <div class="legend-item"><div class="legend-dot" style="background:#d87093;"></div>女性角色</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4682b4;"></div>男性角色</div>
  </div>
  <div class="legend-group">
    <div class="legend-item"><div class="legend-line" style="background:#e57373;"></div>情感关系</div>
    <div class="legend-item"><div class="legend-line" style="background:#ffb74d;"></div>婚姻关系</div>
    <div class="legend-item"><div class="legend-line" style="background:#81c784;"></div>血缘关系</div>
  </div>
</div>

<script>
  // ========== 关系数据（边 + 完整属性） ==========
  const relations = [
    {
      from: 'node1', to: 'node2',
      type: '相爱',
      category: 'love',
      props: {
        '典故': '木石前盟',
        '强度': '极深',
        '结局': '悲剧'
      }
    },
    {
      from: 'node2', to: 'node3',
      type: '婚配',
      category: 'marriage',
      props: {
        '典故': '金玉良缘',
        '形式': '家族安排',
        '结局': '守寡'
      }
    },
    {
      from: 'node1', to: 'node4',
      type: '祖孙',
      category: 'blood',
      props: {
        '血缘': '外孙女',
        '疼爱度': '极高',
        '立场': '支持木石'
      }
    },
    {
      from: 'node2', to: 'node4',
      type: '祖孙',
      category: 'blood',
      props: {
        '血缘': '嫡孙',
        '疼爱度': '最高',
        '地位': '贾府核心'
      }
    },
    {
      from: 'node5', to: 'node4',
      type: '母子',
      category: 'blood',
      props: {
        '血缘': '次子',
        '关系': '正统母子',
        '地位': '荣国府主政'
      }
    },
    {
      from: 'node2', to: 'node5',
      type: '父子',
      category: 'blood',
      props: {
        '血缘': '次子',
        '关系': '严父逆子',
        '期望': '科举仕途'
      }
    }
  ];

  const svg = document.getElementById('edgesLayer');
  const graph = document.getElementById('graph');

  // 获取节点中心点
  function getNodeCenter(nodeId) {
    const node = document.getElementById(nodeId);
    const rect = node.getBoundingClientRect();
    const graphRect = graph.getBoundingClientRect();
    return {
      x: rect.left - graphRect.left + rect.width / 2,
      y: rect.top - graphRect.top + rect.height / 2
    };
  }

  // 绘制所有连线 + 关系卡片
  function drawEdges() {
    svg.innerHTML = '';
    document.querySelectorAll('.edge-card').forEach(el => el.remove());

    relations.forEach(rel => {
      const start = getNodeCenter(rel.from);
      const end = getNodeCenter(rel.to);
      const midX = (start.x + end.x) / 2;
      const midY = (start.y + end.y) / 2;

      // 1. 绘制 SVG 连线
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', start.x);
      line.setAttribute('y1', start.y);
      line.setAttribute('x2', end.x);
      line.setAttribute('y2', end.y);
      line.setAttribute('class', `edge-line ${rel.category}`);
      svg.appendChild(line);

      // 2. 创建关系卡片
      const card = document.createElement('div');
      card.className = `edge-card ${rel.category}`;

      // 主标签
      let html = `<div class="edge-main">${rel.type}</div>`;

      // 属性列表
      html += '<div class="edge-props">';
      for (const [key, value] of Object.entries(rel.props)) {
        html += `<div class="edge-prop-row">
                   <span class="edge-prop-label">${key}</span>
                   <span class="edge-prop-value">${value}</span>
                 </div>`;
      }
      html += '</div>';

      card.innerHTML = html;
      card.style.left = midX + 'px';
      card.style.top = midY + 'px';
      card.style.transform = 'translate(-50%, -50%)';
      graph.appendChild(card);
    });
  }

  // ========== 拖拽功能 ==========
  let dragging = null;
  let offsetX = 0, offsetY = 0;

  document.querySelectorAll('.node-card').forEach(node => {
    node.addEventListener('mousedown', (e) => {
      dragging = node;
      const rect = node.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      e.preventDefault();
    });
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const graphRect = graph.getBoundingClientRect();
    const x = e.clientX - graphRect.left - offsetX;
    const y = e.clientY - graphRect.top - offsetY;
    dragging.style.left = x + 'px';
    dragging.style.top = y + 'px';
    drawEdges();
  });

  document.addEventListener('mouseup', () => {
    dragging = null;
  });

  // 初始化
  window.addEventListener('load', drawEdges);
  window.addEventListener('resize', drawEdges);
</script>

</body>
</html>
